name: Build India Offline Map APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Xmx6g -Dfile.encoding=UTF-8

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare workspace
        run: |
          mkdir -p data/map data/store
          cp map-data/config.json data/map/config.json
          cp map-data/process.lua data/map/process.lua
          df -h

      - name: Download current India OpenStreetMap extract
        run: |
          curl -L --fail --retry 6 --retry-delay 5 \
            -o data/map/india-latest.osm.pbf \
            https://download.geofabrik.de/asia/india-latest.osm.pbf
          ls -lh data/map/india-latest.osm.pbf

      - name: Generate offline vector map
        run: |
          docker pull ghcr.io/systemed/tilemaker:master
          docker run --rm \
            -v "$PWD/data/map:/data/map" \
            -v "$PWD/data/store:/data/store" \
            ghcr.io/systemed/tilemaker:master \
            /data/map/india-latest.osm.pbf \
            --output /data/map/india.pmtiles \
            --config /data/map/config.json \
            --process /data/map/process.lua \
            --store /data/store \
            --threads 4
          ls -lh data/map/india.pmtiles

      - name: Split map into APK-safe asset chunks
        run: |
          mkdir -p app/src/main/assets
          split -b 64M -d -a 3 data/map/india.pmtiles app/src/main/assets/india.pmtiles.part
          ls -lh app/src/main/assets/
          rm -f data/map/india.pmtiles data/map/india-latest.osm.pbf
          rm -f data/map/config.json data/map/process.lua
          rm -rf data/store
          df -h

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          echo 'APK outputs:'
          find app/build/outputs -type f -name '*.apk' -print -exec ls -lh {} \;
          APK=$(find app/build/outputs -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo 'ERROR: No APK was produced.'
            exit 1
          fi
          APK="$(realpath "$APK")"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK: $APK"
          stat "$APK"
          APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort -V | tail -1)
          if [ -z "$APKANALYZER" ]; then
            echo 'ERROR: apkanalyzer was not found.'
            exit 1
          fi
          echo 'Permissions in APK:'
          "$APKANALYZER" manifest permissions "$APK"
          if "$APKANALYZER" manifest permissions "$APK" | grep -q '^android.permission.INTERNET$'; then
            echo 'ERROR: INTERNET permission was merged into the APK.'
            exit 1
          fi
          echo 'PASS: APK contains no INTERNET permission.'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: india-offline-map-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            "$APK" \
            --title "India Offline Map $TAG" \
            --notes "GPS-only offline India map. All map data is bundled in the APK; the final APK is verified to contain no INTERNET permission. Map data: OpenStreetMap contributors / Geofabrik."
